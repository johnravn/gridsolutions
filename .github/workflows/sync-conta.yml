name: Sync Conta customers

# Daily backup for Vercel cron. Fails visibly in Actions if sync is broken.
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production Conta sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.PRODUCTION_URL || 'https://gridsolutions.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in repository secrets."
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-trigger-source: github_actions" \
            "$APP_URL/api/cron/sync-conta")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Conta sync failed with HTTP $code"
            exit 1
          fi
          # `ok:true` still allows status=partial (e.g. one company with Conta 401).
          # Require both legs to be fully successful so ops notices auth/key failures.
          node -e '
            const body = JSON.parse(process.argv[1] || "{}")
            if (body.ok !== true) {
              console.error("Conta sync response missing ok:true")
              process.exit(1)
            }
            const customer = body.customerSync?.status
            const invoice = body.invoicePaidSync?.status
            if (customer !== "success") {
              console.error(`Conta customer sync status was ${customer ?? "missing"} (expected success)`)
              process.exit(1)
            }
            if (invoice !== "success") {
              console.error(`Conta invoice paid sync status was ${invoice ?? "missing"} (expected success)`)
              process.exit(1)
            }
          ' "$body"
